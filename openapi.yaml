    post:
      summary: "Register a student"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                username: {}
                email: {}
                password: {}
                phone: {}
                department: {}
      responses:
        "200":
          description: Success
        "400":
          description: Validation error (message in JSON)
  /login:
    post:
      summary: "Login (all roles), returns JWT token"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {}
                password: {}
      responses:
