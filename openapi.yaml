openapi: 3.0.3
info:
  title: Examination Management Portal API
  version: "2.0"
  description: Flask REST API for the EMP. All endpoints except register and login need a JWT Bearer token.
servers:
  - url: http://localhost:5000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
